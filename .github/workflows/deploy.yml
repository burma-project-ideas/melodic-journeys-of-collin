name: Build and deploy Collin Radio

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT: BlazorWasm.MelodicJourneysOfCollin/BlazorWasm.MelodicJourneysOfCollin.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and build styles
        run: |
          npm ci
          npm run build:css
      - name: Build application
        run: dotnet build "$PROJECT" -c Release
      - name: Publish application
        run: dotnet publish "$PROJECT" -c Release --no-restore -o artifacts/publish
      - name: Verify published app
        run: |
          test -s artifacts/publish/wwwroot/index.html
          test -s artifacts/publish/wwwroot/_framework/blazor.webassembly.js
          test -s artifacts/publish/wwwroot/logo.svg
      - name: Prepare Vercel build output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel/output/static
          cp -a artifacts/publish/wwwroot/. .vercel/output/static/
          node <<'JS'
          const fs = require('fs');
          fs.writeFileSync('.vercel/project.json', JSON.stringify({orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID}));
          fs.writeFileSync('.vercel/output/config.json', JSON.stringify({version: 3, routes: [{src: '/service-worker.js', headers: {'Cache-Control': 'no-cache'}, continue: true}, {handle: 'filesystem'}, {src: '/.*', dest: '/index.html'}]}));
          JS
      - name: Deploy production to Vercel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@52.0.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
