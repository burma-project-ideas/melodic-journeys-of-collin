name: Build Collin Radio

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT: BlazorWasm.MelodicJourneysOfCollin/BlazorWasm.MelodicJourneysOfCollin.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install and build styles
        run: |
          npm ci
          npm run build:css
      - name: Build application
        run: dotnet build "$PROJECT" -c Release
      - name: Publish application
        run: dotnet publish "$PROJECT" -c Release --no-restore -o artifacts/publish
      - name: Verify published app
        run: |
          test -s artifacts/publish/wwwroot/index.html
          test -s artifacts/publish/wwwroot/_framework/blazor.webassembly.js
          test -s artifacts/publish/wwwroot/logo.svg
